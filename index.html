<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Formulario interactivo con menús desplegables dependientes de País, Estado y Ciudad con manejo de errores y accesibilidad."
    />
    <title>Ubicación | Menús Desplegables Dependientes</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="main-container">
      <section class="card" aria-labelledby="form-title">
        <header class="card__header">
          <h1 id="form-title" class="card__title">Selección de Ubicación</h1>
          <p class="card__subtitle">
            Selecciona tu ubicación geográfica de forma secuencial.
          </p>
        </header>

        <form id="location-form" class="card__form" novalidate>
          <!-- Nivel 1: País -->
          <div class="form-group" id="group-country">
            <label for="country" class="form-group__label">
              País
              <span class="form-group__required" aria-hidden="true">*</span>
            </label>
            <div class="form-group__select-wrapper">
              <select
                id="country"
                name="country"
                class="form-group__select"
                required
                aria-required="true"
                aria-busy="false"
                aria-disabled="false"
                aria-describedby="country-hint country-error"
              >
                <option value="">-- Selecciona un país --</option>
              </select>
              <span class="form-group__spinner" aria-hidden="true"></span>
            </div>
            <span id="country-hint" class="form-group__hint"
              >Selecciona tu país de residencia.</span
            >
            <!-- Contenedor de error para accesibilidad -->
            <span id="country-error" class="form-error-msg" role="alert"></span>
          </div>

          <!-- Nivel 2: Estado / Provincia -->
          <div class="form-group" id="group-state">
            <label for="state" class="form-group__label">
              Estado / Provincia
              <span class="form-group__required" aria-hidden="true">*</span>
            </label>
            <div class="form-group__select-wrapper">
              <select
                id="state"
                name="state"
                class="form-group__select"
                disabled
                required
                aria-required="true"
                aria-busy="false"
                aria-disabled="true"
                aria-describedby="state-hint state-error"
              >
                <option value="">-- Selecciona primero un país --</option>
              </select>
              <span class="form-group__spinner" aria-hidden="true"></span>
            </div>
            <span id="state-hint" class="form-group__hint"
              >Habilitado tras elegir un país.</span
            >
            <span id="state-error" class="form-error-msg" role="alert"></span>
          </div>

          <!-- Nivel 3: Ciudad -->
          <div class="form-group" id="group-city">
            <label for="city" class="form-group__label">
              Ciudad
              <span class="form-group__required" aria-hidden="true">*</span>
            </label>
            <div class="form-group__select-wrapper">
              <select
                id="city"
                name="city"
                class="form-group__select"
                disabled
                required
                aria-required="true"
                aria-busy="false"
                aria-disabled="true"
                aria-describedby="city-hint city-error"
              >
                <option value="">-- Selecciona primero un estado --</option>
              </select>
              <span class="form-group__spinner" aria-hidden="true"></span>
            </div>
            <span id="city-hint" class="form-group__hint"
              >Habilitado tras elegir un estado.</span
            >
            <span id="city-error" class="form-error-msg" role="alert"></span>
          </div>

          <button
            type="submit"
            class="card__button"
            disabled
            id="submit-btn"
            aria-disabled="true"
          >
            Confirmar ubicación
          </button>
        </form>

        <!-- 👇 AGREGAR ESTE BLOQUE DE ÉXITO QUE FALTABA -->
        <div id="success-card" class="card__success" hidden>
          <div class="card__success-icon" aria-hidden="true">✓</div>
          <h2 class="card__success-title">¡Ubicación Confirmada!</h2>
          <p class="card__success-desc" id="success-summary">
            Has seleccionado: <span id="summary-text"></span>
          </p>
          <button type="button" class="card__button" id="reset-form-btn">
            Elegir otra ubicación
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
